<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60b8ff"/>
      <stop offset="1" stop-color="#1d6fd1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <g transform="translate(0 -44)">
  <!-- channel tiles of the console -->
  <rect x="408" y="430" width="92" height="92" rx="20" fill="#34d399"/>
  <rect x="524" y="430" width="92" height="92" rx="20" fill="#f97316"/>
  <rect x="408" y="546" width="92" height="92" rx="20" fill="#3da5ff"/>
  <rect x="524" y="546" width="92" height="92" rx="20" fill="#475569"/>
  <!-- headset -->
  <path d="M282 560 A230 230 0 0 1 742 560" fill="none" stroke="#3da5ff" stroke-width="64" stroke-linecap="round"/>
  <rect x="222" y="500" width="120" height="230" rx="54" fill="url(#cup)"/>
  <rect x="682" y="500" width="120" height="230" rx="54" fill="url(#cup)"/>
  <rect x="314" y="540" width="40" height="150" rx="20" fill="#0f3a6b"/>
  <rect x="670" y="540" width="40" height="150" rx="20" fill="#0f3a6b"/>
  <!-- boom mic -->
  <path d="M290 712 Q300 812 430 812" fill="none" stroke="#3da5ff" stroke-width="36" stroke-linecap="round"/>
  <circle cx="462" cy="812" r="40" fill="#f97316"/>
  <!-- transmit waves from the mic -->
  <g fill="none" stroke="#f97316" stroke-linecap="round" stroke-width="30">
    <path d="M524 750 A88 88 0 0 1 524 874"/>
    <path d="M572 708 A148 148 0 0 1 572 916" opacity=".6"/>
